name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
      - name: Install CocoaPods dependencies
        run: pod install
      - name: Build release for iOS Simulator
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.bareRepository
          GIT_CONFIG_VALUE_0: all
        run: |
          set -o pipefail
          xcodebuild \
            -workspace CoreClaw.xcworkspace \
            -scheme CoreClaw \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
      - name: Add failure details to summary
        if: failure()
        run: |
          {
            echo '## Xcode build tail'
            echo '```text'
            tail -n 200 xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
